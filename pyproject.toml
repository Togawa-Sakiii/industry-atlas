[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industry-atlas"
version = "0.1.0"
description = "产业图谱：公开产业数据的可溯源采集、查询与研究记录工具"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "SQLAlchemy>=2.1",
  "fastapi>=0.146",
  "uvicorn>=0.54",
  "pydantic>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=9"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
