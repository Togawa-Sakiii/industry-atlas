name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: 安装依赖
        run: pip install -e ".[dev]"
      - name: Ruff 静态检查
        run: ruff check .
      - name: Pytest 单元测试
        run: pytest -q